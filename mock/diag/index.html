<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostics · SecureVDR</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Mock diagnostics</h1>
        <div class="sub">Everything this browser is actually running, in one place. No login required.</div>
      </div>
    </div>

    <div class="card card-pad">
      <table class="table diag-table">
        <tbody id="summary"></tbody>
      </table>
    </div>

    <div class="card" style="margin-top: 16px">
      <table class="table">
        <thead>
          <tr>
            <th>Document</th>
            <th>Type</th>
            <th>Real file</th>
            <th>Preview data</th>
            <th>Viewer can open</th>
            <th>Would render as</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <p class="diag-note">If anything looks wrong above, copy this whole page's contents into your message.</p>
  </main>

  <script src="../_shared/mock-data.js?v=6"></script>
  <script src="../_shared/mock-helpers.js?v=6"></script>
  <script src="script.js?v=6"></script>
</body>
</html>
